<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frater CRM — Ministerios</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/crm.css">
  <link rel="icon" type="image/png" href="img/LogoFrater_1.png">
</head>
<body>
<div class="crm-layout">

  <aside class="crm-sidebar">
    <div class="crm-brand"><img src="img/LogoFrater_1.png" class="crm-brand-logo" alt="Frater"><span class="crm-brand-badge">CRM</span></div>
    <nav class="crm-nav">
      <span class="crm-nav-section">Principal</span>
      <a href="crm-dashboard.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></svg> Dashboard</a>
      <a href="crm-usuarios.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Usuarios</a>
      <span class="crm-nav-section">Contenido</span>
      <a href="crm-eventos.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Eventos</a>
      <a href="crm-ministerios.html" class="crm-nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Ministerios</a>
      <a href="crm-articulos.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg> Artículos</a>
      <a href="crm-plan.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Plan de Lectura</a>
      <span class="crm-nav-section">Registros</span>
      <a href="crm-oraciones.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Oraciones</a>
      <a href="crm-asistencia.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>  Asistencia</a>
      <a href="crm-servicios.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V11l-2-2 2-2"/><path d="M21 22V11l2-2-2-2"/><path d="M12 22V6"/><path d="M9 6h6"/><path d="M10 4V2h4v2"/><path d="M3 11h18"/><path d="M12 6v4"/></svg> Servicios</a>
      <a href="crm-mensajes.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Mensajes</a>
      <a href="crm-ofrenda.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 12l-4 4-4-4M12 8v7"/></svg> Ofrenda</a>
      <span class="crm-nav-section">Formación</span>
      <a href="crm-facultad.html" class="crm-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Facultad</a>
    </nav>
    <div class="crm-sidebar-footer">
      <div class="crm-admin-name"></div>
      <button class="crm-nav-item danger" onclick="crmLogout()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar Sesión</button>
    </div>
  </aside>

  <div class="crm-main">
    <div class="crm-topbar">
      <h1 class="crm-page-title">Ministerios</h1>
      <span class="crm-topbar-user"></span>
    </div>
    <div class="crm-content">
      <div class="crm-card">
        <div class="crm-card-header">
          <span class="crm-card-title">Todos los ministerios</span>
          <button class="btn-crm btn-crm-primary" onclick="openModal()">+ Nuevo ministerio</button>
        </div>
        <div class="crm-table-wrap">
          <table class="crm-table">
            <thead>
              <tr><th>Ícono</th><th>Nombre</th><th>Horario</th><th>Líderes</th><th>Miembros</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="crm-modal-overlay" id="crmModal">
  <div class="crm-modal">
    <div class="crm-modal-header">
      <h3 id="modalTitle">Nuevo ministerio</h3>
      <button class="crm-modal-close" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="crm-modal-body">
      <div class="crm-field-row">
        <div class="crm-field"><label>Ícono (emoji)</label><input id="f-icono" placeholder="👥" maxlength="4"></div>
        <div class="crm-field"><label>Nombre *</label><input id="f-nombre" placeholder="Ej. Jóvenes Universitarios"></div>
      </div>
      <div class="crm-field"><label>Descripción</label><textarea id="f-descripcion" rows="3" placeholder="Describe el ministerio..."></textarea></div>
      <div class="crm-field-row">
        <div class="crm-field"><label>Horario</label><input id="f-horario" placeholder="Ej. Sábados 6:00 PM"></div>
        <div class="crm-field"><label>Lugar</label><input id="f-lugar" placeholder="Ej. Salón 2"></div>
      </div>
      <div class="crm-field-row">
        <div class="crm-field"><label>Líderes</label><input id="f-lideres" placeholder="Ana García, Marco Pérez"></div>
        <div class="crm-field"><label>Email del líder</label><input type="email" id="f-lider-email" placeholder="lider@ejemplo.com"></div>
      </div>
    </div>
    <div class="crm-modal-footer">
      <button class="btn-crm btn-crm-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-crm btn-crm-primary" id="saveBtn" onclick="saveRecord()">Guardar</button>
    </div>
  </div>
</div>

<style>
  .sol-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1100; }
  .sol-modal-overlay.active { display:flex; align-items:center; justify-content:center; }
  .sol-modal { background:#fff; border-radius:16px; width:560px; max-width:95vw; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .sol-modal-header { padding:20px 24px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
  .sol-modal-header h3 { font-size:1.1rem; font-weight:700; margin:0; }
  .sol-list { overflow-y:auto; padding:16px 24px; display:flex; flex-direction:column; gap:12px; }
  .sol-card { background:#f9f9f9; border-radius:12px; padding:16px; }
  .sol-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .sol-nombre { font-weight:700; font-size:0.95rem; }
  .sol-email { font-size:0.78rem; color:#888; }
  .sol-fecha { font-size:0.75rem; color:#aaa; }
  .sol-mensaje { font-size:0.85rem; color:#555; margin:8px 0; font-style:italic; }
  .sol-actions { display:flex; gap:8px; margin-top:10px; }
  .sol-nota { width:100%; box-sizing:border-box; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.83rem; font-family:inherit; resize:none; margin-top:8px; }
  .badge-pendiente { background:#FEF3C7; color:#92400E; border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:700; }
</style>

<!-- Modal solicitudes -->
<div class="sol-modal-overlay" id="solModal">
  <div class="sol-modal">
    <div class="sol-modal-header">
      <h3 id="solModalTitle">Solicitudes pendientes</h3>
      <button class="crm-modal-close" onclick="closeSolModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sol-list" id="solList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/crm-guard.js"></script>
<script>
  const sb = window.supabaseClient;
  let records = [];
  let currentId = null;
  let memberCounts = {};
  let pendingCounts = {};
  let currentSolMinId = null;

  async function load() {
    const { data } = await sb.from('ministerios').select('*').order('nombre');
    records = data || [];

    // Contar miembros reales
    const { data: counts } = await sb
      .from('miembros_ministerio')
      .select('ministerio_id');
    memberCounts = {};
    (counts || []).forEach(c => {
      memberCounts[c.ministerio_id] = (memberCounts[c.ministerio_id] || 0) + 1;
    });

    // Contar solicitudes pendientes
    const { data: pends } = await sb
      .from('solicitudes_ministerio')
      .select('ministerio_id')
      .eq('estado', 'pendiente');
    pendingCounts = {};
    (pends || []).forEach(p => {
      pendingCounts[p.ministerio_id] = (pendingCounts[p.ministerio_id] || 0) + 1;
    });

    render(records);
  }

  function render(data) {
    const tbody = document.getElementById('tableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="crm-empty"><div class="crm-empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><p>Sin ministerios. Crea el primero.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = data.map(m => {
      const badge = m.activo
        ? '<span class="badge badge-green">Activo</span>'
        : '<span class="badge badge-gray">Inactivo</span>';
      const nMiembros = memberCounts[m.id] || 0;
      const nPend = pendingCounts[m.id] || 0;
      const solBtn = `<button class="btn-crm btn-crm-ghost btn-crm-sm" onclick="openSolicitudes('${m.id}','${m.nombre.replace(/'/g,"\\'")}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Solicitudes${nPend ? ` <span style="background:#EF4444;color:#fff;border-radius:10px;padding:1px 6px;font-size:0.72rem;margin-left:4px;">${nPend}</span>` : ''}
      </button>`;
      return `<tr>
        <td><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></td>
        <td><strong>${m.nombre}</strong></td>
        <td class="muted">${m.horario || '—'}</td>
        <td class="muted truncate">${m.lideres || '—'}</td>
        <td class="muted">${nMiembros}</td>
        <td>${badge}</td>
        <td><div class="crm-td-actions">
          ${solBtn}
          <button class="btn-crm btn-crm-ghost btn-crm-sm" onclick="openModal('${m.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar</button>
          <button class="btn-crm btn-crm-ghost btn-crm-sm" onclick="toggleActivo('${m.id}', ${m.activo})">${m.activo ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Desactivar' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg> Activar'}</button>
          <button class="btn-crm btn-crm-danger btn-crm-sm" onclick="deleteRecord('${m.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div></td>
      </tr>`;
    }).join('');
  }

  function openModal(id = null) {
    currentId = id;
    if (id) {
      const r = records.find(r => r.id === id);
      document.getElementById('modalTitle').textContent = 'Editar ministerio';
      document.getElementById('f-icono').value = r.icono || '';
      document.getElementById('f-nombre').value = r.nombre || '';
      document.getElementById('f-descripcion').value = r.descripcion || '';
      document.getElementById('f-horario').value = r.horario || '';
      document.getElementById('f-lugar').value = r.lugar || '';
      document.getElementById('f-lideres').value = r.lideres || '';
      document.getElementById('f-lider-email').value = r.lider_email || '';
    } else {
      document.getElementById('modalTitle').textContent = 'Nuevo ministerio';
      ['f-icono','f-nombre','f-descripcion','f-horario','f-lugar','f-lideres','f-lider-email'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-icono').value = '👥';
    }
    document.getElementById('crmModal').classList.add('active');
  }

  function closeModal() { document.getElementById('crmModal').classList.remove('active'); currentId = null; }

  async function saveRecord() {
    const nombre = document.getElementById('f-nombre').value.trim();
    if (!nombre) { alert('El nombre es obligatorio.'); return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Guardando...';
    const payload = {
      icono: document.getElementById('f-icono').value.trim() || '👥',
      nombre,
      descripcion: document.getElementById('f-descripcion').value.trim(),
      horario: document.getElementById('f-horario').value.trim(),
      lugar: document.getElementById('f-lugar').value.trim(),
      lideres: document.getElementById('f-lideres').value.trim(),
      lider_email: document.getElementById('f-lider-email').value.trim() || null
    };
    const { error } = currentId
      ? await sb.from('ministerios').update(payload).eq('id', currentId)
      : await sb.from('ministerios').insert({ ...payload, activo: true });
    btn.disabled = false; btn.textContent = 'Guardar';
    if (error) { alert('Error: ' + error.message); return; }
    closeModal(); load();
  }

  async function toggleActivo(id, current) {
    await sb.from('ministerios').update({ activo: !current }).eq('id', id);
    load();
  }

  async function deleteRecord(id) {
    if (!confirm('¿Eliminar este ministerio?')) return;
    await sb.from('ministerios').delete().eq('id', id);
    load();
  }

  // ── Solicitudes ────────────────────────────────────────────
  async function openSolicitudes(minId, minNombre) {
    currentSolMinId = minId;
    document.getElementById('solModalTitle').textContent = `Solicitudes — ${minNombre}`;
    document.getElementById('solList').innerHTML = '<p style="color:#aaa;font-size:0.88rem;padding:8px 0;">Cargando...</p>';
    document.getElementById('solModal').classList.add('active');

    const { data } = await sb.from('solicitudes_ministerio')
      .select('*')
      .eq('ministerio_id', minId)
      .eq('estado', 'pendiente')
      .order('created_at', { ascending: true });

    const list = document.getElementById('solList');
    if (!data?.length) {
      list.innerHTML = '<p style="color:#aaa;font-size:0.88rem;text-align:center;padding:24px 0;">Sin solicitudes pendientes.</p>';
      return;
    }
    list.innerHTML = data.map(s => `
      <div class="sol-card" id="solcard-${s.id}">
        <div class="sol-card-top">
          <div>
            <div class="sol-nombre">${s.user_nombre || '—'}</div>
            <div class="sol-email">${s.user_email || ''}</div>
          </div>
          <span class="badge-pendiente">Pendiente</span>
        </div>
        ${s.mensaje ? `<div class="sol-mensaje">"${s.mensaje}"</div>` : ''}
        <div class="sol-fecha">${new Date(s.created_at).toLocaleDateString('es-SV', { day:'numeric', month:'long', year:'numeric' })}</div>
        <textarea class="sol-nota" rows="2" placeholder="Nota para el miembro (opcional)..." id="nota-${s.id}"></textarea>
        <div class="sol-actions">
          <button class="btn-crm btn-crm-primary btn-crm-sm" onclick="responderSolicitud('${s.id}','${s.user_id}','${s.user_email}','${s.user_nombre?.replace(/'/g,"\\'")||''}','aceptada')">✓ Aceptar</button>
          <button class="btn-crm btn-crm-danger btn-crm-sm" onclick="responderSolicitud('${s.id}','${s.user_id}','${s.user_email}','${s.user_nombre?.replace(/'/g,"\\'")||''}','rechazada')">✕ Rechazar</button>
        </div>
      </div>`).join('');
  }

  function closeSolModal() { document.getElementById('solModal').classList.remove('active'); currentSolMinId = null; }

  async function responderSolicitud(solId, userId, userEmail, userNombre, estado) {
    const nota = document.getElementById(`nota-${solId}`)?.value.trim() || null;
    const min = records.find(r => r.id === currentSolMinId);

    await sb.from('solicitudes_ministerio').update({ estado, nota_lider: nota, updated_at: new Date().toISOString() }).eq('id', solId);

    if (estado === 'aceptada') {
      await sb.from('miembros_ministerio').insert({ user_id: userId, ministerio_id: currentSolMinId });
    }

    // Notificar al usuario
    if (userEmail) {
      fetch(`${SUPABASE_URL}/functions/v1/notify-solicitud`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({
          tipo: estado,
          ministerio_nombre: min?.nombre || '',
          usuario_nombre: userNombre,
          usuario_email: userEmail,
          nota_lider: nota
        })
      }).catch(() => {});
    }

    // Quitar tarjeta
    const card = document.getElementById(`solcard-${solId}`);
    if (card) card.remove();
    if (!document.querySelector('.sol-card')) {
      document.getElementById('solList').innerHTML = '<p style="color:#aaa;font-size:0.88rem;text-align:center;padding:24px 0;">Sin solicitudes pendientes.</p>';
    }
    // Actualizar badge en tabla
    load();
  }

  load();
</script>
</body>
</html>
