<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="css/styles.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1931">
  <link rel="icon" type="image/png" href="img/LogoFrater_1.png">
  <link rel="apple-touch-icon" href="img/LogoFrater_1.png">
  <style>
    .dir-header {
      background: var(--color-navy);
      color: white;
      padding: 50px 24px 20px;
    }
    .dir-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dir-search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: var(--radius-full);
      padding: 10px 16px;
    }
    .dir-search svg { stroke: rgba(255,255,255,0.7); flex-shrink: 0; }
    .dir-search input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: var(--font-main);
      font-size: 0.95rem;
      width: 100%;
    }
    .dir-search input::placeholder { color: rgba(255,255,255,0.55); }
    .dir-count {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin-top: 10px;
    }
    .dir-body { padding: 20px 16px; }
    .dir-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .member-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    .member-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--color-blue);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--color-text-main);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .member-phone {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-bottom: 5px;
    }
    .member-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .member-tag {
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .dir-empty {
      text-align: center;
      color: var(--color-text-muted);
      padding: 48px 24px;
      font-size: 0.95rem;
    }
    .dir-skeleton {
      height: 74px;
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: var(--radius-md);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

  <header class="dir-header">
    <div class="dir-header-top">
      <a href="explore.html" class="btn-back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <h1 style="font-size:1.3rem;">Directorio</h1>
    </div>
    <div class="dir-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar miembro..." oninput="filtrar()">
    </div>
    <p class="dir-count" id="countLabel">Cargando...</p>
  </header>

  <div class="dir-body">
    <div class="dir-grid" id="memberGrid">
      <div class="dir-skeleton"></div>
      <div class="dir-skeleton"></div>
      <div class="dir-skeleton"></div>
      <div class="dir-skeleton"></div>
    </div>
  </div>

  <div class="content-spacer"></div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </a>
    <a href="explore.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      Explora
    </a>
    <a href="#" class="nav-item nav-fab" onclick="toggleFabMenu(); return false;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
    <a href="plan_detalles.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      Plan
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Perfil
    </a>

  <div class="fab-overlay" id="fabOverlay" onclick="closeFabMenu()"></div>
  <div class="fab-sheet" id="fabSheet">

    <a href="ofrenda.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div><div class="fab-action-info"><h4>Hacer una ofrenda</h4><p>Apoya a la iglesia</p></div></a>
    <a href="https://lafratersv.com/invitacion.html" class="fab-action" target="_blank" rel="noopener"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div><div class="fab-action-info"><h4>Invitar a La Frater</h4><p>Comparte con un amigo</p></div></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/fab-menu.js"></script>
  <script>
    const sb = window.supabaseClient;
    let todosLosMiembros = [];

    async function cargarDirectorio() {
      const [{ data: perfiles }, { data: memberships }] = await Promise.all([
        sb.from('profiles').select('id, nombre, telefono').order('nombre', { ascending: true }),
        sb.from('miembros_ministerio').select('user_id, ministerios(nombre)')
      ]);

      const ministriosPorUsuario = {};
      (memberships || []).forEach(m => {
        if (!ministriosPorUsuario[m.user_id]) ministriosPorUsuario[m.user_id] = [];
        if (m.ministerios?.nombre) ministriosPorUsuario[m.user_id].push(m.ministerios.nombre);
      });

      todosLosMiembros = (perfiles || []).map(p => ({
        ...p,
        ministerios: ministriosPorUsuario[p.id] || []
      }));

      renderizar(todosLosMiembros);
    }

    function renderizar(lista) {
      const grid = document.getElementById('memberGrid');
      document.getElementById('countLabel').textContent = `${lista.length} miembro${lista.length !== 1 ? 's' : ''}`;

      if (!lista.length) {
        grid.innerHTML = '<div class="dir-empty">Sin miembros registrados aún.</div>';
        return;
      }

      grid.innerHTML = lista.map(m => {
        const nombre = m.nombre || 'Sin nombre';
        const inicial = nombre.charAt(0).toUpperCase();
        const tags = m.ministerios.map(mn =>
          `<span class="member-tag">${mn}</span>`).join('');
        return `<div class="member-card">
          <div class="member-avatar">${inicial}</div>
          <div class="member-info">
            <div class="member-name">${nombre}</div>
            ${m.telefono ? `<div class="member-phone">📞 ${m.telefono}</div>` : ''}
            ${tags ? `<div class="member-tags">${tags}</div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function filtrar() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) { renderizar(todosLosMiembros); return; }
      renderizar(todosLosMiembros.filter(m =>
        (m.nombre || '').toLowerCase().includes(q) ||
        (m.telefono || '').includes(q) ||
        m.ministerios.some(mn => mn.toLowerCase().includes(q))
      ));
    }

    cargarDirectorio();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
  </script>
</body>
</html>
