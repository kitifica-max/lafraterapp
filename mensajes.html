<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frater - Mensajes</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fab-menu.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1931">
  <link rel="icon" type="image/png" href="img/LogoFrater_1.png">
  <style>
    .page-header {
      background: var(--color-blue);
      padding: 56px 24px 20px;
      color: white;
    }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; }
    .page-header p { font-size: 0.82rem; opacity: 0.75; margin-top: 4px; }

    .chat-list { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 4px; }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: var(--radius-md);
      background: var(--color-surface);
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .chat-row:active { background: var(--color-bg); }

    .chat-avatar-circle {
      width: 46px; height: 46px;
      border-radius: 14px;
      background: var(--color-blue);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-min-name { font-size: 0.95rem; font-weight: 600; color: var(--color-text-main); margin-bottom: 2px; }
    .chat-preview {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-time { font-size: 0.72rem; color: var(--color-text-muted); flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 60px 32px;
      color: var(--color-text-muted);
    }
    .empty-state svg { opacity: 0.25; margin-bottom: 14px; }
    .empty-state h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: var(--color-text-main); }
    .empty-state p { font-size: 0.85rem; line-height: 1.6; }
    .empty-state a { color: var(--color-blue); font-weight: 600; text-decoration: none; }

    .content-spacer { height: 100px; }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>Mensajes</h1>
    <p>Chats de tus ministerios</p>
  </div>

  <div class="chat-list" id="chatList">
    <div class="event-card-skeleton" style="height:70px;border-radius:14px;margin-bottom:4px;"></div>
    <div class="event-card-skeleton" style="height:70px;border-radius:14px;margin-bottom:4px;"></div>
  </div>

  <div class="content-spacer"></div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </a>
    <a href="explore.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      Explora
    </a>
    <a href="#" class="nav-item nav-fab" onclick="toggleFabMenu(); return false;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
    <a href="plan_detalles.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>
      Plan
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Perfil
    </a>
  </nav>

  <div class="fab-overlay" id="fabOverlay" onclick="closeFabMenu()"></div>
  <div class="fab-sheet" id="fabSheet">
    <div class="fab-sheet-handle"></div>
    <p class="fab-sheet-title">Acciones rápidas</p>
    <a href="oracion.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="fab-action-info"><h4>Solicitar oración</h4><p>Envía tu petición al equipo</p></div></a>
    <a href="asistencia.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="fab-action-info"><h4>Registrar asistencia</h4><p>Check-in al servicio de hoy</p></div></a>
    <a href="ofrenda.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div><div class="fab-action-info"><h4>Hacer una ofrenda</h4><p>Apoya a la iglesia</p></div></a>
    <a href="https://lafratersv.com/invitacion.html" class="fab-action" target="_blank" rel="noopener"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div><div class="fab-action-info"><h4>Invitar a La Frater</h4><p>Comparte con un amigo</p></div></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/fab-menu.js"></script>
  <script>
    async function cargarChats() {
      const sb = window.supabaseClient;
      const { data: { user } } = await sb.auth.getUser();
      const list = document.getElementById('chatList');

      const { data: membs } = await sb.from('miembros_ministerio')
        .select('ministerio_id, ministerios(id, nombre)')
        .eq('user_id', user.id);

      if (!membs?.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <h3>Sin chats disponibles</h3>
            <p>Únete a un ministerio para acceder a su chat.<br><a href="explore.html">Explorar ministerios →</a></p>
          </div>`;
        return;
      }

      const minIds = membs.map(m => m.ministerio_id);

      const lastMessages = await Promise.all(minIds.map(async (mid) => {
        const { data } = await sb.from('mensajes_ministerio')
          .select('contenido, created_at, user_id')
          .eq('ministerio_id', mid)
          .order('created_at', { ascending: false })
          .limit(1);
        return data?.[0] || null;
      }));

      function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const now = new Date();
        const diffH = (now - d) / 3600000;
        if (diffH < 24) return d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' });
      }

      list.innerHTML = membs.map((m, i) => {
        const min = m.ministerios;
        const last = lastMessages[i];
        const preview = last ? last.contenido.slice(0, 50) + (last.contenido.length > 50 ? '…' : '') : 'Sin mensajes aún';
        const time = last ? formatTime(last.created_at) : '';
        return `
          <a class="chat-row" href="ministerio_detalle.html?id=${min.id}">
            <div class="chat-avatar-circle">${min.nombre.charAt(0).toUpperCase()}</div>
            <div class="chat-info">
              <div class="chat-min-name">${min.nombre}</div>
              <div class="chat-preview">${preview}</div>
            </div>
            ${time ? `<div class="chat-time">${time}</div>` : ''}
          </a>`;
      }).join('');
    }

    cargarChats();
  </script>
</body>
</html>
