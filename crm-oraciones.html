  <div class="crm-main">
    <div class="crm-topbar">
      <h1 class="crm-page-title">Peticiones de Oración</h1>
      <span class="crm-topbar-user"></span>
    </div>
    <div class="crm-content">

      <!-- Filtros -->
      <div class="crm-card" style="margin-bottom:22px;">
        <div class="crm-card-section crm-filter-bar">
          <select id="filterCategoria" onchange="applyFilter()" class="crm-input" style="width:auto;">
            <option value="">Todas las categorías</option>
            <option value="Salud">Salud</option>
            <option value="Familia">Familia</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Espiritual">Espiritual</option>
            <option value="General">General</option>
          </select>
          <select id="filterAnonima" onchange="applyFilter()" class="crm-input" style="width:auto;">
            <option value="">Todas</option>
            <option value="false">Con nombre</option>
            <option value="true">Anónimas</option>
          </select>
          <span id="totalCount" class="muted" style="margin-left:auto;font-size:0.85rem;"></span>
        </div>
      </div>

      <div class="crm-card">
        <div class="crm-table-wrap">
          <table class="crm-table">
            <thead>
              <tr><th>Nombre</th><th>Categoría</th><th>Petición</th><th>Anónima</th><th>Fecha</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalle -->
<div class="crm-modal-overlay" id="detailModal">
  <div class="crm-modal crm-modal-lg">
    <div class="crm-modal-header">
      <h3>Detalle de petición</h3>
      <button class="crm-modal-close" onclick="closeDetail()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="crm-modal-body">
      <div class="crm-field-row" style="margin-bottom:16px;">
        <div class="crm-field"><label class="crm-label">Nombre</label><p id="d-nombre" style="margin:4px 0 0;font-weight:600;color:#111827;"></p></div>
        <div class="crm-field"><label class="crm-label">Categoría</label><p id="d-categoria" style="margin:4px 0 0;"></p></div>
        <div class="crm-field"><label class="crm-label">Fecha</label><p id="d-fecha" class="muted" style="margin:4px 0 0;"></p></div>
        <div class="crm-field"><label class="crm-label">Anónima</label><p id="d-anonima" style="margin:4px 0 0;"></p></div>
      </div>
      <div class="crm-field" style="margin-bottom:0;">
        <label class="crm-label">Petición completa</label>
        <p id="d-peticion" style="margin:8px 0 0;line-height:1.6;background:#f9fafb;padding:16px;border-radius:8px;border:1px solid #e5e7eb;"></p>
      </div>
    </div>
    <div class="crm-modal-footer">
      <button class="btn-crm btn-crm-secondary" onclick="closeDetail()">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/crm-guard.js"></script>
<script>
  const sb = window.supabaseClient;
  let records = [];

  async function load() {
    const { data } = await sb.from('peticiones_oracion')
      .select('*')
      .order('created_at', { ascending: false });
    records = data || [];
    applyFilter();
  }

  function applyFilter() {
    const cat = document.getElementById('filterCategoria').value;
    const anon = document.getElementById('filterAnonima').value;
    let filtered = records;
    if (cat) filtered = filtered.filter(r => r.categoria === cat);
    if (anon !== '') filtered = filtered.filter(r => String(r.anonima) === anon);
    document.getElementById('totalCount').textContent = `${filtered.length} petición${filtered.length !== 1 ? 'es' : ''}`;
    render(filtered);
  }

  function render(data) {
    const tbody = document.getElementById('tableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="crm-empty"><div class="crm-empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><p>Sin peticiones aún.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = data.map(r => {
      const f = new Date(r.created_at);
      const fecha = `${f.getDate()}/${f.getMonth()+1}/${f.getFullYear()}`;
      const nombre = r.anonima ? '<span class="muted">Anónimo</span>' : `<strong>${r.nombre || '—'}</strong>`;
      const anonBadge = r.anonima
        ? '<span class="badge badge-gray">Sí</span>'
        : '<span class="badge badge-blue">No</span>';
      const peticionPreview = (r.peticion || '').length > 80
        ? r.peticion.substring(0, 80) + '…'
        : r.peticion;
      return `<tr style="cursor:pointer;" onclick="openDetail('${r.id}')">
        <td>${nombre}</td>
        <td><span class="badge badge-blue">${r.categoria || '—'}</span></td>
        <td class="muted">${peticionPreview}</td>
        <td>${anonBadge}</td>
        <td class="muted">${fecha}</td>
      </tr>`;
    }).join('');
  }

  function openDetail(id) {
    const r = records.find(r => r.id === id);
    if (!r) return;
    const f = new Date(r.created_at);
    document.getElementById('d-nombre').textContent = r.anonima ? 'Anónimo' : (r.nombre || '—');
    document.getElementById('d-categoria').innerHTML = `<span class="badge badge-blue">${r.categoria || '—'}</span>`;
    document.getElementById('d-fecha').textContent = `${f.getDate()}/${f.getMonth()+1}/${f.getFullYear()} ${f.getHours()}:${String(f.getMinutes()).padStart(2,'0')}`;
    document.getElementById('d-anonima').innerHTML = r.anonima ? '<span class="badge badge-gray">Sí</span>' : '<span class="badge badge-blue">No</span>';
    document.getElementById('d-peticion').textContent = r.peticion || '—';
    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetail() { document.getElementById('detailModal').classList.remove('active'); }

  load();
</script>
</body>
</html>
