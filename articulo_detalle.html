<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frater - Artículo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fab-menu.css">
  <link rel="stylesheet" href="css/articulo_detalle.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1931">
  <link rel="icon" type="image/png" href="img/LogoFrater_1.png">
  <link rel="apple-touch-icon" href="img/LogoFrater_1.png">
</head>
<body>

  <!-- Carrusel hero -->
  <div class="article-hero" id="articuloHero">
    <a href="javascript:history.back()" class="btn-back btn-back-overlay">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <!-- Slides insertados por JS -->
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>

  <main class="detail-body">
    <div class="article-meta">
      <span class="blog-tag" id="articuloCategoria">Noticias</span>
      <span class="article-date" id="articuloFecha"></span>
    </div>

    <h1 class="article-title" id="articuloTitulo">Cargando...</h1>
    <p class="article-autor" id="articuloAutor"></p>

    <div class="article-content" id="articuloContenido"></div>

    <!-- Like + stats -->
    <div class="article-engagement">
      <button class="btn-like" id="btnLike" onclick="toggleLike()">
        <svg id="likeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="likeCount">0</span>
      </button>
      <div class="article-stats">
        <span class="stat-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="vistaCount">0</span> vistas
        </span>
      </div>
    </div>
  </main>

  <div class="content-spacer"></div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </a>
    <a href="explore.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      Explora
    </a>
    <a href="#" class="nav-item nav-fab" onclick="toggleFabMenu(); return false;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
    <a href="plan_detalles.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      Plan
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Perfil
    </a>
  </nav>

  <div class="fab-overlay" id="fabOverlay" onclick="closeFabMenu()"></div>
  <div class="fab-sheet" id="fabSheet">
    <div class="fab-sheet-handle"></div>
    <p class="fab-sheet-title">Acciones rápidas</p>
    <a href="oracion.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="fab-action-info"><h4>Solicitar oración</h4><p>Envía tu petición al equipo</p></div></a>
    <a href="asistencia.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="fab-action-info"><h4>Registrar asistencia</h4><p>Check-in al servicio de hoy</p></div></a>
    <a href="ofrenda.html" class="fab-action"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div><div class="fab-action-info"><h4>Hacer una ofrenda</h4><p>Apoya a la iglesia</p></div></a>
    <a href="https://lafratersv.com/invitacion.html" class="fab-action" target="_blank" rel="noopener"><div class="fab-action-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div><div class="fab-action-info"><h4>Invitar a La Frater</h4><p>Comparte con un amigo</p></div></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/fab-menu.js"></script>
  <script>
    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const sb = window.supabaseClient;
    const params = new URLSearchParams(location.search);
    const articuloId = params.get('id');
    let userId = null;
    let yaLike = false;
    let currentSlide = 0;
    let totalSlides = 0;

    // ── CARRUSEL ─────────────────────────────────────────────
    function buildCarousel(imagenes) {
      const track = document.getElementById('carouselTrack');
      const dots  = document.getElementById('carouselDots');
      totalSlides = imagenes.length;

      if (!totalSlides) {
        // Sin imágenes: fondo navy genérico
        document.getElementById('articuloHero').classList.add('hero-no-image');
        track.innerHTML = `<div class="carousel-slide carousel-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg>
        </div>`;
        dots.style.display = 'none';
        return;
      }

      track.innerHTML = imagenes.map((url, i) =>
        `<div class="carousel-slide" style="background-image:url('${url}')"></div>`
      ).join('');

      if (totalSlides > 1) {
        dots.innerHTML = imagenes.map((_, i) =>
          `<button class="carousel-dot${i===0?' active':''}" onclick="goSlide(${i})"></button>`
        ).join('');
        dots.style.display = 'flex';
        setupSwipe();
      } else {
        dots.style.display = 'none';
      }
    }

    function goSlide(i) {
      const track = document.getElementById('carouselTrack');
      currentSlide = i;
      track.style.transform = `translateX(-${i * 100}%)`;
      document.querySelectorAll('.carousel-dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === i);
      });
    }

    function setupSwipe() {
      const hero = document.getElementById('articuloHero');
      let startX = 0;
      hero.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      hero.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          goSlide(Math.max(0, Math.min(totalSlides - 1, currentSlide + (diff > 0 ? 1 : -1))));
        }
      }, { passive: true });
    }

    // ── LIKE ─────────────────────────────────────────────────
    async function loadEngagement() {
      const [{ count: vistas }, { count: likes }, { data: myLike }] = await Promise.all([
        sb.from('articulos_vistas').select('id', { count: 'exact', head: true }).eq('articulo_id', articuloId),
        sb.from('articulos_likes').select('id', { count: 'exact', head: true }).eq('articulo_id', articuloId),
        userId
          ? sb.from('articulos_likes').select('id').eq('articulo_id', articuloId).eq('user_id', userId).maybeSingle()
          : { data: null }
      ]);
      document.getElementById('vistaCount').textContent = vistas ?? 0;
      document.getElementById('likeCount').textContent  = likes  ?? 0;
      yaLike = !!myLike;
      updateLikeBtn();
    }

    function updateLikeBtn() {
      const btn  = document.getElementById('btnLike');
      const icon = document.getElementById('likeIcon');
      if (yaLike) {
        btn.classList.add('liked');
        icon.setAttribute('fill', '#EF4444');
        icon.setAttribute('stroke', '#EF4444');
      } else {
        btn.classList.remove('liked');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
      }
    }

    async function toggleLike() {
      if (!userId) return;
      if (yaLike) {
        await sb.from('articulos_likes').delete().eq('articulo_id', articuloId).eq('user_id', userId);
      } else {
        await sb.from('articulos_likes').upsert({ articulo_id: articuloId, user_id: userId });
      }
      yaLike = !yaLike;
      const countEl = document.getElementById('likeCount');
      countEl.textContent = parseInt(countEl.textContent) + (yaLike ? 1 : -1);
      updateLikeBtn();
    }

    async function registrarVista() {
      if (!userId) return;
      await sb.from('articulos_vistas').upsert(
        { articulo_id: articuloId, user_id: userId },
        { onConflict: 'articulo_id,user_id', ignoreDuplicates: true }
      );
    }

    // ── INIT ─────────────────────────────────────────────────
    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      userId = user?.id ?? null;

      if (!articuloId) { document.getElementById('articuloTitulo').textContent = 'Artículo no encontrado'; return; }

      const { data: a } = await sb.from('articulos')
        .select('*').eq('id', articuloId).eq('publicado', true).single();

      if (!a) { document.getElementById('articuloTitulo').textContent = 'No encontrado'; return; }

      document.title = `Frater - ${a.titulo}`;
      document.getElementById('articuloCategoria').textContent = a.categoria || 'Artículo';
      document.getElementById('articuloTitulo').textContent    = a.titulo;
      if (a.autor) document.getElementById('articuloAutor').textContent = `Por ${a.autor}`;

      const fecha = new Date(a.created_at);
      document.getElementById('articuloFecha').textContent =
        `${fecha.getDate()} de ${MESES[fecha.getMonth()]}, ${fecha.getFullYear()}`;

      const contenidoEl = document.getElementById('articuloContenido');
      const parrafos = (a.contenido || '').split('\n').filter(p => p.trim());
      contenidoEl.innerHTML = parrafos.map(p => `<p>${p}</p>`).join('');

      // Carrusel
      buildCarousel(Array.isArray(a.imagenes) && a.imagenes.length ? a.imagenes : []);

      // Engagement en paralelo
      await Promise.all([loadEngagement(), registrarVista()]);
    }

    init();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
  </script>
</body>
</html>
