<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frater - Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1931">
  <link rel="icon" type="image/png" href="img/LogoFrater_1.png">
  <link rel="apple-touch-icon" href="img/LogoFrater_1.png">
</head>
<body>

  <div class="login-container">

    <header class="login-header">
      <img src="img/LogoFrater_1.png" alt="Logo Frater" onerror="this.outerHTML='<h1 style=\'color:#0A1931;\'>FRATER</h1>'">
    </header>

    <main class="login-body">
      <h1 class="login-title">¡Bienvenido!</h1>
      <p class="login-subtitle">Inicia sesión en tu cuenta para continuar.</p>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" required autocomplete="email">
          <p class="input-error-msg" id="emailError">Ingresa un correo válido.</p>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-password-wrap">
            <input type="password" id="password" placeholder="Tu contraseña" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" onclick="togglePassword('password', this)">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <p class="input-error-msg" id="passwordError">Ingresa tu contraseña.</p>
        </div>

        <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn-primary" id="submitBtn">Iniciar sesión</button>
      </form>

    </main>

    <footer class="login-footer">
      © 2026 Fraternidad Cristiana de El Salvador
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) window.location.replace('app.html');
    })();

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.innerHTML = isText
        ? '<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>'
        : '<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const authError = document.getElementById('authError');
      const btn = document.getElementById('submitBtn');

      authError.style.display = 'none';

      if (!email || !password) {
        if (!email) { document.getElementById('emailError').style.display = 'block'; document.getElementById('email').classList.add('error'); }
        if (!password) { document.getElementById('passwordError').style.display = 'block'; document.getElementById('password').classList.add('error'); }
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
        authError.textContent = error.message === 'Invalid login credentials'
          ? 'Correo o contraseña incorrectos. Verifica tus datos.'
          : error.message;
        authError.style.display = 'block';
      } else {
        window.location.replace('app.html');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>

<!-- PWA Install Toast -->
<div id="pwaToast" style="
  display:none;
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 48px);
  max-width:400px;
  background:#0A1931;
  color:#fff;
  border-radius:16px;
  padding:16px 18px;
  box-shadow:0 8px 32px rgba(0,0,0,0.28);
  z-index:9999;
  font-family:Arial,sans-serif;
  animation:slideUp .35s ease;
">
  <button onclick="document.getElementById('pwaToast').style.display='none'" style="
    position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(255,255,255,0.5);
    font-size:18px;cursor:pointer;line-height:1;padding:0;
  ">✕</button>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
    <img src="img/LogoFrater_1.png" style="width:36px;height:36px;border-radius:8px;background:#fff;padding:2px;">
    <div>
      <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.5px;">FRATER APP</p>
      <p id="pwaToastSub" style="margin:0;font-size:11px;color:rgba(255,255,255,0.55);">Instala la app</p>
    </div>
  </div>
  <p id="pwaToastMsg" style="margin:0 0 12px;font-size:13px;color:rgba(255,255,255,0.85);line-height:1.5;"></p>
  <button id="pwaInstallBtn" style="
    display:none;width:100%;padding:10px;background:#185ADB;border:none;border-radius:10px;
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  ">Instalar app</button>
</div>

<style>
@keyframes slideUp {
  from { opacity:0; transform:translateX(-50%) translateY(20px); }
  to   { opacity:1; transform:translateX(-50%) translateY(0); }
}
</style>

<script>
(function() {
  const toast   = document.getElementById('pwaToast');
  const msg     = document.getElementById('pwaToastMsg');
  const sub     = document.getElementById('pwaToastSub');
  const installBtn = document.getElementById('pwaInstallBtn');

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;

  if (isInStandalone) return; // ya instalada, no mostrar

  if (isIOS) {
    sub.textContent = 'Agrega a pantalla de inicio';
    msg.textContent = 'Para la mejor experiencia, agrega esta app a tu pantalla de inicio: toca el botón Compartir (□↑) y selecciona "Agregar a pantalla de inicio".';
    toast.style.display = 'block';
    return;
  }

  // Android / Chrome — capturar el evento beforeinstallprompt
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    sub.textContent = 'Disponible para instalar';
    msg.textContent = 'Instala la app de La Frater en tu dispositivo para acceder más rápido y sin navegador.';
    installBtn.style.display = 'block';
    toast.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    toast.style.display = 'none';
  });

  // Si no dispara beforeinstallprompt (Android sin soporte o ya instalada), mostrar igual instrucciones básicas
  setTimeout(() => {
    if (toast.style.display === 'none' || toast.style.display === '') {
      sub.textContent = 'Agrega a pantalla de inicio';
      msg.textContent = 'Instala la app de La Frater: toca el menú ⋮ de tu navegador y selecciona "Agregar a pantalla de inicio".';
      installBtn.style.display = 'none';
      toast.style.display = 'block';
    }
  }, 1500);
})();
</script>

</body>
</html>
