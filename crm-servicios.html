  <div class="crm-main">

    </div>
    <div class="crm-content">
      <div class="crm-card">
        <div class="crm-card-header">
          <span class="crm-card-title">Servicios de asistencia</span>
          <button class="btn-crm btn-crm-primary" onclick="openModal()">+ Nuevo servicio</button>
        </div>
        <div class="crm-table-wrap">
          <table class="crm-table">
            <thead>
              <tr><th>Nombre</th><th>Hora</th><th>Lugar</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="muted" style="text-align:center;padding:24px;">Cargando...</td></tr>

<!-- Modal -->
<div class="crm-modal-overlay" id="crmModal">
  <div class="crm-modal">
    <div class="crm-modal-header">
      <h3 id="modalTitle">Nuevo servicio</h3>
      <button class="crm-modal-close" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="crm-modal-body">
      <div id="modalError" class="crm-form-error" style="display:none;"></div>
      <input type="hidden" id="f-id">
      <div class="crm-field">
        <label>Nombre *</label>
        <input id="f-nombre" placeholder="Ej. Servicio Dominical" type="text">
      </div>
      <div class="crm-field-row">
        <div class="crm-field">
          <label>Hora</label>
          <input id="f-hora" placeholder="Ej. 9:00 AM" type="text">
        </div>
        <div class="crm-field">
          <label>Lugar</label>
          <input id="f-lugar" placeholder="Ej. Auditorio Principal" type="text">
        </div>
      </div>
      <div class="crm-field">
        <label>Estado</label>
        <select id="f-activo">
          <option value="true">Activo</option>
          <option value="false">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="crm-modal-footer">
      <button class="btn-crm" onclick="closeModal()">Cancelar</button>
      <button class="btn-crm btn-crm-primary" id="saveBtn" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/crm-guard.js"></script>
<script>
  const sb = window.supabaseClient;

  async function cargar() {
    const { data, error } = await sb
      .from('servicios')
      .select('*')
      .order('orden', { ascending: true });

    const tbody = document.getElementById('tableBody');
    if (error || !data?.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px;">Sin servicios aún.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(s => `
      <tr>
        <td><strong>${s.nombre}</strong></td>
        <td>${s.hora || '<span class="muted">—</span>'}</td>
        <td>${s.lugar || '<span class="muted">—</span>'}</td>
        <td><span class="badge ${s.activo ? 'badge-green' : 'badge-gray'}">${s.activo ? 'Activo' : 'Inactivo'}</span></td>
        <td>
          <button class="btn-crm btn-crm-ghost btn-crm-sm" onclick="editar(${JSON.stringify(s).replace(/"/g,'&quot;')})">Editar</button>
          <button class="btn-crm btn-crm-ghost btn-crm-sm" onclick="toggleActivo('${s.id}', ${s.activo})">${s.activo ? 'Desactivar' : 'Activar'}</button>
          <button class="btn-crm btn-crm-danger btn-crm-sm" onclick="eliminar('${s.id}', '${s.nombre}')">Eliminar</button>
        </td>
      </tr>`).join('');
  }

  function openModal(reset = true) {
    if (reset) {
      document.getElementById('modalTitle').textContent = 'Nuevo servicio';
      document.getElementById('f-id').value = '';
      document.getElementById('f-nombre').value = '';
      document.getElementById('f-hora').value = '';
      document.getElementById('f-lugar').value = '';
      document.getElementById('f-activo').value = 'true';
    }
    document.getElementById('modalError').style.display = 'none';
    document.getElementById('crmModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('crmModal').classList.remove('active');
  }

  function editar(s) {
    document.getElementById('modalTitle').textContent = 'Editar servicio';
    document.getElementById('f-id').value    = s.id;
    document.getElementById('f-nombre').value = s.nombre;
    document.getElementById('f-hora').value   = s.hora || '';
    document.getElementById('f-lugar').value  = s.lugar || '';
    document.getElementById('f-activo').value = s.activo ? 'true' : 'false';
    openModal(false);
  }

  async function guardar() {
    const btn = document.getElementById('saveBtn');
    const errEl = document.getElementById('modalError');
    errEl.style.display = 'none';

    const nombre = document.getElementById('f-nombre').value.trim();
    if (!nombre) { errEl.textContent = 'El nombre es obligatorio.'; errEl.style.display = 'block'; return; }

    const payload = {
      nombre,
      hora:   document.getElementById('f-hora').value.trim() || null,
      lugar:  document.getElementById('f-lugar').value.trim() || null,
      activo: document.getElementById('f-activo').value === 'true'
    };

    btn.disabled = true;
    const id = document.getElementById('f-id').value;
    const { error } = id
      ? await sb.from('servicios').update(payload).eq('id', id)
      : await sb.from('servicios').insert(payload);

    btn.disabled = false;
    if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    closeModal();
    cargar();
  }

  async function toggleActivo(id, actual) {
    await sb.from('servicios').update({ activo: !actual }).eq('id', id);
    cargar();
  }

  async function eliminar(id, nombre) {
    if (!confirm(`¿Eliminar "${nombre}"?`)) return;
    await sb.from('servicios').delete().eq('id', id);
    cargar();
  }

  cargar();
</script>
</body>
